<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寻迹 · 校园失物招领</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="topbar-inner">
      <span class="logo">寻迹</span>
      <span id="page-title" class="page-title">校园失物招领</span>
    </div>
  </header>

  <main class="view-wrap">

    <!-- ========== 视图：首页 ========== -->
    <section id="view-home" class="view">
      <div id="stats-bar" class="stats-bar"></div>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input id="search-input" type="text" placeholder="搜索物品名称 / 地点 / 描述…" autocomplete="off">
        <button id="search-clear" class="search-clear" data-action="clear-search" title="清空关键词">✕</button>
      </div>
      <div id="search-tools" class="search-tools"></div>

      <div id="type-tabs" class="tabs"></div>

      <div class="filter-panel">
        <div id="filter-bar" class="filter-bar"></div>
        <div class="filter-foot">
          <span id="result-count" class="result-count"></span>
          <button id="reset-btn" class="link-btn" data-action="reset-filters">一键重置</button>
        </div>
      </div>

      <div id="card-list" class="card-list"></div>
    </section>

    <!-- ========== 视图：详情 ========== -->
    <section id="view-detail" class="view"></section>

    <!-- ========== 视图：发布 ========== -->
    <section id="view-publish" class="view">
      <form id="publish-form" class="publish-form" novalidate>
        <div class="form-card">
          <div class="type-switch">
            <label class="type-option"><input type="radio" name="type" value="lost" checked><span>🔎 寻物</span></label>
            <label class="type-option"><input type="radio" name="type" value="found"><span>📣 招领</span></label>
          </div>

          <div class="form-item">
            <label class="form-label">物品名称 <em>*</em></label>
            <input class="form-input" name="title" type="text" maxlength="40" placeholder="如：黑色保温杯">
            <p class="field-error" data-err="title"></p>
          </div>

          <div class="form-item">
            <label class="form-label">物品类别 <em>*</em></label>
            <select class="form-input" name="category">
              <option value="">请选择类别</option>
              <option>电子设备</option><option>证件卡片</option><option>钥匙</option>
              <option>服饰箱包</option><option>书籍文具</option><option>其他</option>
            </select>
            <p class="field-error" data-err="category"></p>
          </div>

          <div class="form-item">
            <label class="form-label">所在区域 <em>*</em></label>
            <select class="form-input" name="area">
              <option value="">请选择区域</option>
              <option>教学区</option><option>图书馆</option><option>食堂</option>
              <option>宿舍区</option><option>运动场</option><option>其他</option>
            </select>
            <p class="field-error" data-err="area"></p>
          </div>

          <div class="form-item">
            <label class="form-label">具体地点 <em>*</em></label>
            <input class="form-input" name="location" type="text" maxlength="80" placeholder="如：图书馆三楼靠窗座位">
            <p class="field-error" data-err="location"></p>
          </div>

          <div class="form-item">
            <label class="form-label">丢失 / 拾取时间</label>
            <input class="form-input" name="eventTime" type="datetime-local">
            <p class="field-error" data-err="eventTime"></p>
          </div>

          <div class="form-item">
            <label class="form-label">详细描述</label>
            <textarea class="form-input" name="description" rows="3" maxlength="500" placeholder="颜色、特征、时间细节…"></textarea>
            <p class="field-error" data-err="description"></p>
          </div>

          <div class="form-item">
            <label class="form-label">联系方式 <em>*</em></label>
            <input class="form-input" name="contact" type="text" maxlength="100" placeholder="手机号 / 微信 / QQ，如 QQ：123456">
            <p class="field-error" data-err="contact"></p>
          </div>

          <button type="submit" class="btn btn-primary btn-block">发布信息</button>
          <p class="form-tip">发布后可在「我的发布」中标记已找到 / 已归还</p>
        </div>
      </form>
    </section>

    <!-- ========== 视图：我的发布 ========== -->
    <section id="view-myposts" class="view">
      <div id="myposts-list" class="card-list"></div>
    </section>

  </main>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <button class="tabbar-item active" data-view="home"><span class="tabbar-icon">🏠</span><span>首页</span></button>
    <button class="tabbar-item" data-view="publish"><span class="tabbar-icon">➕</span><span>发布</span></button>
    <button class="tabbar-item" data-view="myposts"><span class="tabbar-icon">👤</span><span>我的发布</span></button>
  </nav>

  <!-- 弹窗容器 -->
  <div id="modal-root" class="modal-root"></div>
  <!-- Toast 容器 -->
  <div id="toast-root" class="toast-root"></div>
</div>

<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
